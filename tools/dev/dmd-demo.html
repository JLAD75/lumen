<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMD — banc d'essai</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #04060b; color: #c9dcf2; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; color: #ffb27a; letter-spacing: .04em; }
  p.note { margin: 0 0 14px; color: #7f93b8; }
  #screens { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-bottom: 16px; }
  figure { margin: 0; }
  figcaption { color: #7f93b8; font-size: 11px; margin-top: 4px; }
  canvas.dmd { display: block; background: #000; border-radius: 4px; box-shadow: 0 0 0 1px #2a1a10, 0 0 0 4px #0d0805, 0 0 0 5px #24160c; }
  .phone { padding: 10px 8px 0; width: 206px; background: #0b111d; border-radius: 18px 18px 0 0; border: 1px solid #1c2a44; border-bottom: none; }
  .phone .table { height: 70px; margin-top: 8px; background: linear-gradient(#0c1730, #050a16); border-radius: 6px 6px 0 0; }
  fieldset { border: 1px solid #1c2a44; border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: #ffb27a; padding: 0 4px; }
  button { background: #101a2c; color: #d6e6ff; border: 1px solid #2a3c5e; border-radius: 6px; padding: 5px 9px; margin: 2px; cursor: pointer; font: inherit; }
  button:hover { border-color: #ff7b1c; }
  button.on { background: #3a1c08; border-color: #ff7b1c; }
  label { margin-right: 12px; }
  #perf { font: 12px/1.4 Consolas, monospace; color: #9fe7a8; white-space: pre; }
</style>
</head>
<body>
<h1>LUMEN//NULL — afficheur matriciel (DMD 128×32)</h1>
<p class="note">Banc d'essai de <code>src/ui/dmd.js</code> : mêmes appels envoyés à tous les afficheurs (tailles CSS réelles, densité de pixels de l'écran).</p>
<section id="screens"></section>
<fieldset><legend>Événements — show()</legend><div id="ev"></div></fieldset>
<fieldset><legend>Messages — say()</legend><div id="talk"></div></fieldset>
<fieldset><legend>État</legend><div id="state"></div></fieldset>
<fieldset><legend>Performance de draw()</legend><div id="perf"></div></fieldset>
<script type="module" src="dmd-demo.js"></script>
</body>
</html>
